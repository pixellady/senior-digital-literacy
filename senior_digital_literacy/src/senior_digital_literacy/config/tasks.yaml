# One task per conversational turn. Flow will kick off Tutor OR Scam, not both.
# Mode playbook lives here (this turn). Identity and never-break rules live in agents.yaml.

tutor_turn_task:
  description: >
    This is one tutoring turn for an older adult learner in {current_year}.

    Learner message: {user_message}
    Client action: {client_action}
    Mode for THIS turn: {mode}
    Learning track: {learning_track}
    Device context: {device_context}
    Learner goal: {learner_goal}
    Last completed or current step: {last_step}

    Do exactly one of: teach the next single step, repeat the last step,
    explain the last step more simply, or start the current step over.
    Beginner track: micro-steps and device basics first.
    Partial User track: one standard life-goal step.
    No-Device track: visual-first, short caption, public-computer reminder.

    MODE PLAYBOOK (follow the mode named above only):
    - normal: one step (or one Beginner micro-step). Wait-style close:
      ask them to try it and come back. Do not dump a full lesson.
    - patient: Extra Guidance is on (Extra Guidance click, frustration,
      or repeated confusion). Re-explain the SAME step more slowly.
      Disclose once that you are an AI guide, not a person. Offer Pause.
      Still only one step — just more support around it.
    - Do not use priority mode on the tutor path.

    If the learner's message looks like an active scam or a pasted suspicious
    text, do not issue a scam verdict. Set interrupt.active to true and put
    a short handoff in interrupt.label "Scam checker tip". Keep tutoring
    voice out of that tip.

    Sensitive banking or security how-to: if you do not have a verified
    tutorial snippet, refuse to guess. Say you can only follow the verified
    guide, and offer Extra Guidance.

    Tutorial RAG is not wired. Set content.verified_guide to false.
    Fill the named TutorTurnForm: risk_level null, resource_links [].
  expected_output: >
    Fill the named form TutorTurnForm (Pydantic). JSON fields:

    {
      "agent_id": "step_by_step_tutor",
      "agent_display_name": "Your tutor",
      "mode": "normal" or "patient",
      "ai_disclosure": true if this turn entered or is in patient mode, else false,
      "content": {
        "text": "plain-language string, one step only",
        "verified_guide": false,
        "step_card": {
          "illustration_url": "string or empty",
          "alt_text": "string or empty",
          "caption": "string or empty"
        },
        "risk_level": null,
        "resource_links": []
      },
      "interrupt": {
        "active": false,
        "label": "Scam checker tip"
      },
      "ui": {
        "actions": ["pause", "explain_simpler", "repeat_step", "start_over", "get_extra_help"],
        "clarifying_question": false
      }
    }
  agent: step_by_step_tutor
  guardrail: >
    Must fill named form TutorTurnForm. Valid JSON. One tutoring step.
    mode must be normal or patient. risk_level must be null.
    No shame language. No scam verdict. No invented banking or password steps.
  guardrail_max_retries: 2

scam_check_task:
  description: >
    This is one Scam Defense turn for an older adult in {current_year}.

    Learner message: {user_message}
    Client action: {client_action}
    Mode for THIS turn: {mode}
    Suspicious content they shared (may be empty): {suspicious_content}

    Give a calm assessment and one safe next action. Optional: a short
    drill or quiz item if they asked to practice — still one turn.

    MODE PLAYBOOK (follow the mode named above only):
    - normal: classify as likely_scam, suspicious, or likely_safe. Explain
      why in plain language. Recommend one safe action. No blame.
    - priority: active scam or critical risk. First: hang up if on a call,
      do not pay, do not share codes or passwords. Then point to IC3 and
      AARP. Disclose once that you are an AI guide, not a person. Do not
      promise a human will call them.
    - Do not use patient mode on the scam path.

    Never claim to be a bank, the government, or law enforcement.
    Never ask them to paste passwords, one-time codes, or account numbers.
    Do not tutor email or phone skills; if they want a how-to lesson,
    say the tutor can help with that after they are safe.

    You have exactly one tool: search_scam_library. Call it with the
    learner message before you answer. Use only that library. Do not
    search the open web. If the tool matches, use its risk_level,
    guidance, and resource_links; set verified_guide true. If it does
    not match, set verified_guide false, pick suspicious or likely_safe,
    and use only catalog links the tool returned (often none).
  expected_output: >
    Fill the named form ScamTurnForm (Pydantic). JSON fields:

    {
      "agent_id": "scam_detector",
      "agent_display_name": "Scam checker",
      "mode": "normal" or "priority",
      "ai_disclosure": true if this turn entered or is in priority mode, else false,
      "content": {
        "text": "plain-language risk assessment and safe next action",
        "verified_guide": true only if search_scam_library matched, else false,
        "step_card": null,
        "risk_level": "likely_scam" or "suspicious" or "likely_safe" or "critical",
        "resource_links": [
          {"label": "string", "url": "string"}
        ]
      },
      "interrupt": {
        "active": false,
        "label": "Scam checker tip"
      },
      "ui": {
        "actions": ["pause", "explain_simpler", "repeat_step", "start_over", "get_extra_help"],
        "clarifying_question": false
      }
    }
  agent: scam_detector
  guardrail: >
    Must fill named form ScamTurnForm. Valid JSON. One scam-check turn.
    mode must be normal or priority. risk_level must be likely_scam,
    suspicious, likely_safe, or critical. Calm tone. Do not blame the user.
    Do not claim to be a bank, police, or a person who will call back.
  guardrail_max_retries: 2
